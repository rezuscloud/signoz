# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: signoz-community

before:
  hooks:
    - go mod tidy

builds:
  - id: signoz
    binary: bin/signoz
    main: ./cmd/community
    # RZ: the release image is alpine (musl) — a CGO binary links glibc and
    # fails with "exec ./signoz-community: no such file or directory".
    # sqlite is modernc.org (pure Go), so CGO is not needed.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    ldflags:
      - -s -w
      - -X github.com/SigNoz/signoz/pkg/version.version=v{{ .Version }}
      - -X github.com/SigNoz/signoz/pkg/version.variant=community
      - -X github.com/SigNoz/signoz/pkg/version.hash={{ .ShortCommit }}
      - -X github.com/SigNoz/signoz/pkg/version.time={{ .CommitTimestamp }}
      - -X github.com/SigNoz/signoz/pkg/version.branch={{ .Branch }}
      - -X github.com/SigNoz/signoz/pkg/analytics.key=9kRrJ7oPCGPEJLF6QjMPLt5bljFhRQBr
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - timetzdata

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{- .Os }}_{{- .Arch }}
    wrap_in_directory: true
    strip_binary_directory: false
    files:
      - src: README.md
        dst: README.md
      - src: LICENSE
        dst: LICENSE
      - src: frontend/build
        dst: web
      - src: conf
        dst: conf
      - src: templates
        dst: templates

release:
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto

# RZ: fork image release (OSS goreleaser; upstream builds images in a
# separate pro-split pipeline we don't license). Ported from the proven
# rezus/0.127 release flow.
# Tag-shape contract (tibrezus/harmostes#595): the IMAGE tag is the git
# tag VERBATIM (v…-rezus.11) — no variant suffix at all. The ordinal is
# then a digit-only semver prerelease identifier and ranks numerically:
# monotonic through every boundary and width. Never fuse a suffix onto
# the ordinal (…-rezus.11-community makes the identifier alphanumeric →
# lexical ranking → "10-community" < "9-community", silently stalling
# the Flux ImagePolicy at every 9→10 boundary). Arch suffixes on the
# per-arch digests (-amd64/-arm64) are fine — no policy ever matches them.
dockers:
  - id: signoz-community-amd64
    ids:
      - signoz
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: ./cmd/community/Dockerfile.ghcr
    build_flag_templates:
      - --platform=linux/amd64
    extra_files:
      - frontend/build
      - templates
    image_templates:
      - "ghcr.io/rezuscloud/signoz:v{{ .Version }}-amd64"
  - id: signoz-community-arm64
    ids:
      - signoz
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: ./cmd/community/Dockerfile.ghcr
    build_flag_templates:
      - --platform=linux/arm64
    extra_files:
      - frontend/build
      - templates
    image_templates:
      - "ghcr.io/rezuscloud/signoz:v{{ .Version }}-arm64"

docker_manifests:
  - id: signoz-community
    name_template: "ghcr.io/rezuscloud/signoz:v{{ .Version }}"
    # goreleaser v2 requires the explicit image list — without it the
    # manifest pipe skips with "manifest has no images".
    image_templates:
      - "ghcr.io/rezuscloud/signoz:v{{ .Version }}-amd64"
      - "ghcr.io/rezuscloud/signoz:v{{ .Version }}-arm64"
