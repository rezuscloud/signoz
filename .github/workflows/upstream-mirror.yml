# Upstream mirror — the trigger signal for event-driven fork-maintenance
# (harmostes#192 pattern, ported from rezuscloud/forgejo).
#
# Keeps refs/heads/main in this repo tracking SigNoz/signoz's main. When the
# branch moves, GitHub fires a push webhook to harmostes (HMAC-verified),
# which dispatches the fork-maintenance sync (the engine fetches upstream
# itself for the merge — this branch is a movement SIGNAL, not the sync
# transport).
#
# When upstream is unchanged, `git push` reports "Everything up-to-date",
# GitHub fires NO push event, and harmostes dispatches nothing. A weekly
# scheduled no-op run on the harmostes side (fork-maintenance-signoz-weekly,
# Saturday 04:00) bounds drift if this action ever breaks silently.
#
# IMPORTANT: this branch (main) is a MIRROR — never commit to it directly;
# it is force-reset to upstream on every run. Fork work happens on
# rezus/main (default) and lands via PRs.
#
# Runs on GitHub free-tier runners (public repo) — zero cluster compute.
name: upstream-mirror

on:
  schedule:
    - cron: "30 */6 * * *"   # offset from forgejo's :00 to dodge cron congestion
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: upstream-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream release line
        run: |
          git remote add upstream https://github.com/SigNoz/signoz
          git fetch upstream +refs/heads/main:refs/remotes/upstream/main --no-tags

      - name: Push mirror branch (no-op when upstream is static)
        run: |
          git push --force origin refs/remotes/upstream/main:refs/heads/rezus/mirror-main
